<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Parse JavaScript SDK -->
    <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            min-height: 100vh;
        }

        .tab-indicator {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-fade-in {
            animation: fadeIn 0.3s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 antialiased text-slate-100">

    <main class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 rounded-2xl shadow-2xl p-8 relative overflow-hidden">
        
        <!-- Subtle Glow Effects -->
        <div class="absolute -top-12 -left-12 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl pointer-events-none"></div>
        <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-purple-500/10 rounded-full blur-2xl pointer-events-none"></div>

        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-600/20 text-indigo-400 mb-3 border border-indigo-500/20">
                <i class="fa-solid fa-shield-halved text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white" id="heading-title">Welcome Back</h1>
            <p class="text-sm text-slate-400 mt-1" id="heading-sub">Sign in to access your account</p>
        </div>

        <!-- Tab Controls -->
        <div class="relative bg-slate-950/60 p-1 rounded-xl mb-6 border border-slate-800/60 flex items-center">
            <div id="tab-highlight" class="tab-indicator absolute top-1 left-1 bottom-1 w-[calc(50%-4px)] bg-indigo-600 rounded-lg shadow-md"></div>
            
            <button id="tab-login" onclick="switchTab('login')" class="relative z-10 w-1/2 py-2 text-sm font-medium text-white transition-colors duration-200 text-center">
                Log In
            </button>
            <button id="tab-register" onclick="switchTab('register')" class="relative z-10 w-1/2 py-2 text-sm font-medium text-slate-400 hover:text-white transition-colors duration-200 text-center">
                Register
            </button>
        </div>

        <!-- Log In Form -->
        <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4 form-fade-in">
            <div>
                <label for="login-username" class="block text-xs font-medium text-slate-300 mb-1.5 uppercase tracking-wider">Username or Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                        <i class="fa-regular fa-user text-sm"></i>
                    </span>
                    <input type="text" id="login-username" required placeholder="name@example.com" class="w-full bg-slate-950/50 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-3.5 py-2.5 pl-10 text-sm text-white placeholder-slate-500 transition-all outline-none">
                </div>
            </div>

            <div>
                <label for="login-password" class="block text-xs font-medium text-slate-300 mb-1.5 uppercase tracking-wider">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-slate-950/50 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-3.5 py-2.5 pl-10 text-sm text-white placeholder-slate-500 transition-all outline-none">
                </div>
            </div>

            <button type="submit" id="btn-login" class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-xl shadow-lg shadow-indigo-600/20 transition-all duration-200 flex items-center justify-center gap-2 mt-2">
                <span>Log In</span>
            </button>
        </form>

        <!-- Register Form (Hidden by default) -->
        <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
            <div>
                <label for="reg-username" class="block text-xs font-medium text-slate-300 mb-1.5 uppercase tracking-wider">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                        <i class="fa-regular fa-user text-sm"></i>
                    </span>
                    <input type="text" id="reg-username" required placeholder="johndoe" class="w-full bg-slate-950/50 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-3.5 py-2.5 pl-10 text-sm text-white placeholder-slate-500 transition-all outline-none">
                </div>
            </div>

            <div>
                <label for="reg-email" class="block text-xs font-medium text-slate-300 mb-1.5 uppercase tracking-wider">Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                        <i class="fa-regular fa-envelope text-sm"></i>
                    </span>
                    <input type="email" id="reg-email" required placeholder="name@example.com" class="w-full bg-slate-950/50 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-3.5 py-2.5 pl-10 text-sm text-white placeholder-slate-500 transition-all outline-none">
                </div>
            </div>

            <div>
                <label for="reg-password" class="block text-xs font-medium text-slate-300 mb-1.5 uppercase tracking-wider">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" id="reg-password" required placeholder="••••••••" class="w-full bg-slate-950/50 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-3.5 py-2.5 pl-10 text-sm text-white placeholder-slate-500 transition-all outline-none">
                </div>
            </div>

            <button type="submit" id="btn-register" class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-xl shadow-lg shadow-indigo-600/20 transition-all duration-200 flex items-center justify-center gap-2 mt-2">
                <span>Create Account</span>
            </button>
        </form>

        <!-- Toast Notification Box -->
        <div id="toast" class="hidden transform transition-all duration-300 mt-6 p-3.5 rounded-xl border text-xs font-medium flex items-center gap-3">
            <i id="toast-icon" class="text-base"></i>
            <span id="toast-message" class="flex-1"></span>
        </div>
    </main>

    <script>
        // =========================================================================
        // PARSE SDK INITIALIZATION STRUCTURE
        // Set environment/config variables or update string placeholders below.
        // =========================================================================
        const PARSE_APP_ID = "j50HVgdkfS72Kx682iPfyrGhZNX5dtUtGbNZFrVW";
        const PARSE_JS_KEY = "K0JBwyXcKKmELpFwIF4V8gt0NIdOIRb5Lbd5MgF4";
        const PARSE_SERVER_URL = "https://parseapi.back4app.com"; // Default or custom URL

        Parse.initialize(PARSE_APP_ID, PARSE_JS_KEY);
        Parse.serverURL = PARSE_SERVER_URL;

        function switchTab(tab) {
            const highlight = document.getElementById('tab-highlight');
            const loginForm = document.getElementById('form-login');
            const regForm = document.getElementById('form-register');
            const loginTabBtn = document.getElementById('tab-login');
            const regTabBtn = document.getElementById('tab-register');
            const headTitle = document.getElementById('heading-title');
            const headSub = document.getElementById('heading-sub');

            hideToast();

            if (tab === 'login') {
                highlight.style.transform = 'translateX(0%)';
                loginTabBtn.classList.replace('text-slate-400', 'text-white');
                regTabBtn.classList.replace('text-white', 'text-slate-400');

                loginForm.classList.remove('hidden');
                loginForm.classList.add('form-fade-in');
                regForm.classList.add('hidden');

                headTitle.innerText = "Welcome Back";
                headSub.innerText = "Sign in to access your account";
            } else {
                highlight.style.transform = 'translateX(100%)';
                regTabBtn.classList.replace('text-slate-400', 'text-white');
                loginTabBtn.classList.replace('text-white', 'text-slate-400');

                regForm.classList.remove('hidden');
                regForm.classList.add('form-fade-in');
                loginForm.classList.add('hidden');

                headTitle.innerText = "Create Account";
                headSub.innerText = "Get started by filling out your details";
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            hideToast();

            const usernameInput = document.getElementById('login-username').value.trim();
            const passwordInput = document.getElementById('login-password').value;
            const submitBtn = document.getElementById('btn-login');

            setButtonLoading(submitBtn, true, "Logging in...");

            try {
                // Parse Login Request
                const user = await Parse.User.logIn(usernameInput, passwordInput);
                showToast("success", `Welcome back, ${user.getUsername() || 'User'}!`);
                console.log(JSON.stringify(Parse.User.current()));
                window.location.href = "/dashboard.html";
            } catch (error) {
                // Fallback handling for demo environment when placeholders aren't configured
                if (PARSE_APP_ID === "YOUR_PARSE_APP_ID") {
                    setTimeout(() => {
                        showToast("info", "Parse SDK initialized. Configure PARSE_APP_ID to enable backend auth.");
                    }, 500);
                } else {
                    showToast("error", error.message || "Failed to log in.");
                }
            } finally {
                setButtonLoading(submitBtn, false, "Log In");
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            hideToast();

            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const submitBtn = document.getElementById('btn-register');

            setButtonLoading(submitBtn, true, "Creating Account...");

            try {
                // Parse Signup Request
                const user = new Parse.User();
                user.set("username", username);
                user.set("email", email);
                user.set("password", password);

                await user.signUp();
                showToast("success", "Account created successfully!");
            } catch (error) {
                // Fallback handling for demo environment when placeholders aren't configured
                if (PARSE_APP_ID === "YOUR_PARSE_APP_ID") {
                    setTimeout(() => {
                        showToast("info", "Parse SDK initialized. Configure PARSE_APP_ID to enable backend auth.");
                    }, 500);
                } else {
                    showToast("error", error.message || "Failed to create account.");
                }
            } finally {
                setButtonLoading(submitBtn, false, "Create Account");
            }
        }

        function setButtonLoading(button, isLoading, text) {
            if (isLoading) {
                button.disabled = true;
                button.classList.add('opacity-80', 'cursor-not-allowed');
                button.innerHTML = `<div class="spinner"></div><span>${text}</span>`;
            } else {
                button.disabled = false;
                button.classList.remove('opacity-80', 'cursor-not-allowed');
                button.innerHTML = `<span>${text}</span>`;
            }
        }

        function showToast(type, message) {
            const toast = document.getElementById('toast');
            const toastIcon = document.getElementById('toast-icon');
            const toastMessage = document.getElementById('toast-message');

            toast.className = "p-3.5 rounded-xl border text-xs font-medium flex items-center gap-3 transition-all duration-300 form-fade-in";

            if (type === "success") {
                toast.classList.add('bg-emerald-500/10', 'border-emerald-500/20', 'text-emerald-300');
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
            } else if (type === "error") {
                toast.classList.add('bg-rose-500/10', 'border-rose-500/20', 'text-rose-300');
                toastIcon.className = "fa-solid fa-circle-exclamation text-rose-400";
            } else {
                toast.classList.add('bg-indigo-500/10', 'border-indigo-500/20', 'text-indigo-300');
                toastIcon.className = "fa-solid fa-circle-info text-indigo-400";
            }

            toastMessage.innerText = message;
            toast.classList.remove('hidden');
        }

        function hideToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('hidden');
        }
    </script>
</body>
</html>
